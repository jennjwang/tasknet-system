[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tasknet"
version = "0.2.0"
description = "TaskNet System: interview workers, aggregate what they say into an occupational task list, validate it."
requires-python = ">=3.10"
license = {text = "CC0-1.0"}
dependencies = [
    "tasknet-aggregate",    # the git submodule at aggregate/: pip install -e ./aggregate (make setup does it)
    "openai>=1.0",
]

[project.scripts]
tasknet = "tasknet.cli:main"

[tool.setuptools.packages.find]
include = ["tasknet*"]

[tool.setuptools.package-data]
tasknet = ["prompts/*.txt"]
